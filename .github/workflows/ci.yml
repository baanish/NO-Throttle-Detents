name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore tests/NuclearOptionDetents.Tests/NuclearOptionDetents.Tests.csproj
      - run: dotnet run --project tests/NuclearOptionDetents.Tests/NuclearOptionDetents.Tests.csproj --configuration Release --no-restore
